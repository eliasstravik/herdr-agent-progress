[package]
name = "herdr-progress"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent-reported task progress in Herdr's native sidebar"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.23"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
