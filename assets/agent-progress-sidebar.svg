<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">A task, an agent's estimate, and progress in your Herdr sidebar</title>
  <desc id="desc">Illustrated example: you ask an agent to fix failing tests, it reports 65 percent while testing changes, and Herdr displays the estimate beside the session. Another reporting session is done.</desc>
  <rect width="960" height="500" rx="20" fill="#f6f8fa"/>
  <rect x="28" y="28" width="904" height="444" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="54" cy="54" r="6" fill="#ff7b72"/><circle cx="74" cy="54" r="6" fill="#f2cc60"/><circle cx="94" cy="54" r="6" fill="#56d364"/>
  <rect x="124" y="43" width="420" height="22" rx="11" fill="#eef1f4"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="58" y="100" width="250" height="324" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <rect x="78" y="124" width="210" height="34" rx="7" fill="#f6f8fa"/>
    <circle cx="96" cy="141" r="5" fill="#4ac26b"/>
    <text x="108" y="146" font-size="15" font-weight="700" fill="#24292f">Your coding agent</text>
    <rect x="112" y="172" width="176" height="46" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="200" y="191" text-anchor="middle" font-size="12.5" fill="#0a3069">"Fix the failing tests</text>
    <text x="200" y="208" text-anchor="middle" font-size="12.5" fill="#0a3069">in the API."</text>
    <rect x="78" y="228" width="176" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="166" y="247" text-anchor="middle" font-size="12.5" fill="#24292f">"I've made the fix.</text>
    <text x="166" y="264" text-anchor="middle" font-size="12.5" fill="#24292f">Running the tests now."</text>
    <rect x="78" y="300" width="210" height="52" rx="8" fill="#f6f8fa"/>
    <text x="183" y="322" text-anchor="middle" font-size="13" fill="#57606a">You get on with your work.</text>
    <text x="183" y="341" text-anchor="middle" font-size="13" fill="#57606a">The agent reports as it goes.</text>
    <text x="183" y="397" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">1. Give it a task</text>

    <path d="M324 246h48" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><path d="m362 236 12 10-12 10" fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="348" y="230" text-anchor="middle" font-size="11" fill="#57606a">reports</text>

    <rect x="388" y="100" width="210" height="324" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <rect x="398" y="124" width="190" height="34" rx="7" fill="#f6f8fa"/>
    <text x="493" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">Agent Progress</text>
    <text x="493" y="219" text-anchor="middle" font-size="38" font-weight="700" fill="#0969da">~65%</text>
    <text x="493" y="256" text-anchor="middle" font-size="15" fill="#24292f">Testing changes</text>
    <text x="493" y="276" text-anchor="middle" font-size="13" fill="#57606a">The agent's own estimate</text>
    <rect x="410" y="300" width="166" height="52" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="493" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#7d4e00">Five minutes quiet?</text>
    <text x="493" y="341" text-anchor="middle" font-size="11" fill="#7d4e00">Unfinished reports show stale</text>
    <text x="493" y="397" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">2. It reports progress</text>

    <path d="M614 246h48" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><path d="m652 236 12 10-12 10" fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="638" y="230" text-anchor="middle" font-size="11" fill="#57606a">shows</text>

    <rect x="678" y="100" width="224" height="324" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <rect x="698" y="124" width="184" height="34" rx="7" fill="#f6f8fa"/>
    <text x="790" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">Your Herdr sidebar</text>
    <rect x="698" y="170" width="184" height="92" rx="8" fill="#ffffff" stroke="#d8dee4"/>
    <text x="710" y="190" font-size="12" font-weight="700" fill="#57606a">api</text>
    <circle cx="716" cy="210" r="5" fill="#4ac26b"/>
    <text x="730" y="215" font-size="12.5" fill="#24292f">codex · working</text>
    <text x="710" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#24292f">~65% · Testing changes</text>
    <rect x="698" y="270" width="184" height="64" rx="8" fill="#ffffff" stroke="#d8dee4"/>
    <text x="710" y="290" font-size="12" font-weight="700" fill="#57606a">docs</text>
    <text x="710" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#24292f">100% · Done</text>
    <rect x="698" y="342" width="184" height="28" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="790" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#116329">Check · choose · review</text>
    <text x="790" y="397" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">3. See where it stands</text>
    <text x="900" y="452" text-anchor="end" font-size="11" fill="#57606a">Illustrated example</text>
  </g>
</svg>
